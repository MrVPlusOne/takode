name: Landing page

# Publishes site/ to GitHub Pages. The page's demo is the Takode app itself, built from the same
# commit (web/src/site-demo), so a change to the app redeploys the page too.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build the demo app
        working-directory: web
        run: bun --no-install run build:site-demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
